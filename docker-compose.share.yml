# Read-only share on chakakhan. No models, no uploads.
# Bring up the databases, import a dump, then this file serves the plate.
#
#   docker compose -f docker-compose.share.yml up -d
#   bin/import_share.sh share
#   open http://<chakakhan>:8095

services:
  postgres:
    image: postgres:16
    container_name: chakakhan-postgres
    environment:
      POSTGRES_USER: sound
      POSTGRES_PASSWORD: sound
      POSTGRES_DB: sound_detection
    ports:
      - "5433:5432"
    volumes:
      - chakakhan_postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.20
    container_name: chakakhan-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - chakakhan_neo4j_data:/data

  api:
    build: .
    image: sound-detection-api
    container_name: chakakhan-api
    environment:
      DATABASE_URL: postgresql+asyncpg://sound:sound@postgres:5432/sound_detection
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      READ_ONLY: "1"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j

  birdsong:
    build: https://github.com/dcaulton/birdsong.git#main
    image: sound-detection-birdsong
    container_name: chakakhan-birdsong
    ports:
      - "8095:80"
    environment:
      BIRDNET_URL: http://api:8000

volumes:
  chakakhan_postgres_data:
  chakakhan_neo4j_data:
