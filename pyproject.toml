[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sound-detection"
version = "0.2.0"
description = "Bioacoustics ML pipeline for wildlife detection (bats, birds, insects) — part of the weathervane ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Dave Caulton"}]
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "structlog>=24.4",
    "rich>=13.9",
    "python-dotenv>=1.0",
    # Audio & ML (Torch installed separately for CUDA compatibility)
    "librosa>=0.10",
    "soundfile>=0.13",
    "pydub>=0.25",
    "mlflow>=2.17",
    "numpy>=2.1",
    "resampy>=0.4.0",
    # Bioacoustics
    "birdnetlib>=0.18.1",
    "neo4j>=6.2.0",
    "tensorflow-cpu>=2.21.0",
    "ollama>=0.6.2",
    "wikipedia>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "pypdf>=6.13.2",
    "langchain-ollama>=1.1.0",
    "python-docx>=1.2.0",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "sound-detection[dev]",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.14.2",
    "sqlalchemy[mypy]>=2.0.50",
    "pydantic[mypy]>=2.13.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict = false

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "birdnetlib",
    "birdnetlib.*",
    "rich.console",
    "alembic",
    "sqlmodel",
    "sqlalchemy",
    "sqlalchemy.*",
    "testcontainers.*",
    "uuid",
    "uvicorn",
]
ignore_missing_imports = true

[tool.alembic]
script_location = "src/sound_detection/db/migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
